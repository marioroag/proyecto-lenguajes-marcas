<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R&M Wiki | Inicio</title>
  <link rel="stylesheet" href="css/styles.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="media/logo.png">
      <span class="brand__name">R&M Wiki</span>
    </a>

    <nav class="site-nav">
      <a class="site-nav__link" href="index.html">Inicio</a>
      <a class="site-nav__link" href="sobre_nosotros.html">Sobre nosotros</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-hero">
      <h1 class="page-hero__title">Proponer mejora</h1>
      <p class="page-hero__subtitle">Ayuda a mejorar la wiki del multiverso.</p>
    </section>

    <div class="contribuir">
      <form class="form" action="#" method="post">
        <label class="form__field">
          <span class="form__label">Título del artículo</span>
          <input class="form__input" type="text" name="titulo" placeholder="Ej: Morty Smith" />
        </label>

        <label class="form__field">
          <span class="form__label">Categoría</span>
          <select class="form__select" name="categoria">
            <option value="">Selecciona una</option>
            <option>Personaje</option>
            <option>Episodio</option>
            <option>Lugar</option>
            <option>Objeto</option>
          </select>
        </label>

        <label class="form__field">
          <span class="form__label">Descripción</span>
          <textarea class="form__textarea" name="descripcion" rows="6" placeholder="Escribe la propuesta..."></textarea>
        </label>

        <fieldset class="form__fieldset">
          <legend class="form__legend">Nivel de spoiler</legend>
          <label class="form__radio">
            <input type="radio" name="spoiler" />
            <span>Sin spoilers</span>
          </label>
          <label class="form__radio">
            <input type="radio" name="spoiler" />
            <span>Leves</span>
          </label>
          <label class="form__radio">
            <input type="radio" name="spoiler" />
            <span>Altos</span>
          </label>
        </fieldset>

        <button class="btn_form" type="submit">Enviar propuesta</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__links">
      <a href="https://instagram.com/rmwiki" class="site-footer__link">
        <img src="media/instagram.png" alt="Instagram">
      </a>
      <a href="#" class="site-footer__link">
        <img src="media/x.png" alt="X">
      </a>
      <a href="https://youtube.com/rmwiki" class="site-footer__link">
        <img src="media/youtube.png" alt="YouTube">
      </a>
    </div>
    <a class="site-footer__text" href="mailto:contacto@rmwiki.com">Contacto: contacto@rmwiki.com</a>
  </footer>
</body>

</html>
