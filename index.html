<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R&M Wiki | Inicio</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand__logo">R&M</span>
      <span class="brand__name">R&M Wiki</span>
    </div>

    <nav class="site-nav">
      <a class="site-nav__link" href="#">Inicio</a>
      <a class="site-nav__link" href="#">Sobre nosotros</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-hero">
      <h1 class="page-hero__title">Artículos destacados</h1>
      <p class="page-hero__subtitle">Personajes, episodios, lugares y objetos del multiverso.</p>
    </section>

    <section class="grid">
      <!-- TARJETA (1 ejemplo). Duplicar hasta tener 5 -->
      <article class="card">
        <img class="card__img" src="img/placeholder.jpg" alt="Imagen del artículo" />

        <div class="card__body">
          <h2 class="card__title">Rick Sanchez</h2>
          <p class="card__meta">Categoría: Personaje</p>
          <p class="card__meta">Dato rápido: Dimensión C-137</p>

          <a class="btn" href="#">Ver más</a>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__links">
      <a href="#" class="site-footer__link">Instagram</a>
      <a href="#" class="site-footer__link">X</a>
      <a href="#" class="site-footer__link">YouTube</a>
    </div>
    <p class="site-footer__text">Contacto: contacto@rmwiki.com</p>
  </footer>
</body>
</html>
