<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R&M Wiki | Inicio</title>
  <link rel="stylesheet" href="css/styles.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand__logo" src="media/logo.png">
      <span class="brand__name">R&M Wiki</span>
    </a>

    <nav class="site-nav">
      <a class="site-nav__link" href="index.html">Inicio</a>
      <a class="site-nav__link" href="sobre_nosotros.html">Sobre nosotros</a>
    </nav>
  </header>

  <main class="container">
    <article class="detail">
      <img class="detail__img" id="imagen-personaje" src="../media/1.jpeg" alt="Imagen del artículo" />

      <div class="detail__content detail__esconder">
        <h1 class="detail__title" id="nombre-personaje">Rick Sanchez</h1>
        <p class="detail__desc" id="descripcion-personaje">
          Descripción estilo wiki: quién es, qué hace, por qué es relevante, etc.
        </p>

        <ul class="detail__facts">
          <li><strong>Categoría:</strong> Personaje</li>
          <li><strong>Especie:</strong> <span id="especie-personaje"></span></li>
          <li><strong>Estado:</strong> <span id="estado-personaje"></span></li>
        </ul>

        <a class="btn_detalle" href="contribuir.html">Proponer mejora</a>
      </div>
      <button id="boton_esconder">asdasds</button>
    </article>
  </main>

  <footer class="site-footer">
    <div class="site-footer__links">
      <a href="https://instagram.com/rmwiki" class="site-footer__link">
        <img src="media/instagram.png" alt="Instagram">
      </a>
      <a href="#" class="site-footer__link">
        <img src="media/x.png" alt="X">
      </a>
      <a href="https://youtube.com/rmwiki" class="site-footer__link">
        <img src="media/youtube.png" alt="YouTube">
      </a>
    </div>
    <a class="site-footer__text" href="mailto:contacto@rmwiki.com">Contacto: contacto@rmwiki.com</a>
  </footer>
  <script src="script.js"></script>

</body>

</html>
